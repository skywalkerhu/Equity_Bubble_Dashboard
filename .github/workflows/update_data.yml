name: Superbubble Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'  # Runs every 12 hours

jobs:
  Commit-and-Push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync with remote before generating
        run: git pull --rebase origin main

      - name: Run Data Engine
        run: python data_engine.py

      - name: Show what the engine wrote
        run: git status --porcelain

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          if git diff --cached --quiet; then
            echo "::error::data_engine.py produced no changes to data/"
            exit 1
          fi
          git commit -m "Automated data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push