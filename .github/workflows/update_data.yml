name: Weekly Superbubble Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours

jobs:
  Commit-and-Push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Data Engine
        run: python data_engine.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Force clean the workspace to remove debris
          git clean -fd
          git reset --hard HEAD
          
          # Pull latest remote changes cleanly
          git pull --rebase origin main
          
          # Add the data/ folder for the commit
          git add data/
          
          # Smart commit: Only commit and push if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data update" && git push)

  ping-dashboard:
    runs-on: ubuntu-latest
    needs: [Commit-and-Push] # Only ping if the data update succeeded
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake Streamlit Dashboard
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          URL = 'https://equitybubbledashboard-jadequity.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, timeout=60000)

              try:
                  # Sleeping apps show a static shell with this wake button
                  button = page.get_by_text('Yes, get this app back up!')
                  button.wait_for(timeout=15000)
                  button.click()
                  print('App was asleep — clicked wake button.')
                  page.wait_for_timeout(15000)  # give it time to boot
              except Exception:
                  print('No wake button found — app was likely already awake.')

              browser.close()
          "