name: Weekly Superbubble Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight

jobs:
  Commit-and-Push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Data Engine
        run: python data_engine.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Force clean the workspace to remove debris
          git clean -fd
          git reset --hard HEAD
          
          # Pull latest remote changes cleanly
          git pull --rebase origin main
          
          # Add the data/ folder for the commit
          git add data/
          
          # Smart commit: Only commit and push if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data update" && git push)

  ping-dashboard:
    runs-on: ubuntu-latest
    needs: [Commit-and-Push] # Only ping if the data update succeeded
    steps:
      - name: Ping Dashboard
        run: |
          # Replace with your actual Streamlit app URL
          curl -I https://equitybubbledashboard-jadequity.streamlit.app/