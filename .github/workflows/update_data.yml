name: Weekly Superbubble Data Update

on:
  schedule:
# Runs at 00:00 UTC on Sunday
  - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows the workflow to push changes to the repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies and Run Data Engine
      run: |
        python -m pip install --upgrade pip
        
        # Force install the exact packages the data engine needs directly
        python -m pip install yfinance pandas numpy statsmodels pandas-datareader

        echo "Executing Data Engine"
        python data_engine.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/
        
        # Smart commit: Only commit and push if there are actual changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data update" && git push)