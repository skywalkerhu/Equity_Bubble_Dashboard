name: Superbubble Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'  # Runs every 12 hours

jobs:
  Commit-and-Push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync with remote before generating
        run: git pull --rebase origin main

      - name: Run Data Engine
        run: python data_engine.py

      - name: Show what the engine wrote
        run: git status --porcelain

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          if git diff --cached --quiet; then
            echo "::error::data_engine.py produced no changes to data/"
            exit 1
          fi
          git commit -m "Automated data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  ping-dashboard:
    runs-on: ubuntu-latest
    needs: [Commit-and-Push]
    if: always()  # Keepalive must run even if the data update failed
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake Streamlit Dashboard
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          URL = 'https://equitybubbledashboard-jadequity.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, timeout=60000)

              try:
                  # Sleeping apps show a static shell with this wake button
                  button = page.get_by_text('Yes, get this app back up!')
                  button.wait_for(timeout=15000)
                  button.click()
                  print('App was asleep — clicked wake button.')
                  page.wait_for_timeout(15000)  # give it time to boot
              except Exception:
                  print('No wake button found — app was likely already awake.')

              browser.close()
          "
