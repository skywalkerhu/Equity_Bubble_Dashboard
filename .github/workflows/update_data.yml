name: Weekly Superbubble Data Update

# Runs every Friday at 22:00 UTC (after market close) and allows manual trigger
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Data Engine
        run: |
          python data_engine.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update weekly macro data"
          git push